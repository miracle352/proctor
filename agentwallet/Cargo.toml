[package]
name = "proctor-agent-wallet"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
repository = "https://github.com/miracle352/proctor"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.9", features = ["legacy"] }
serde_json = "1.0"

[dev-dependencies]
near-sdk = { version = "5.9", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.18.0-rust-1.86.0"
image_digest = "sha256:2d0d458d2357277df669eac6fa23a1ac922e5ed16646e1d3315336e4dff18043"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]
