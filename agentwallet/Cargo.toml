[package]
name = "proctor-agent-wallet"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
repository = "https://github.com/miracle352/proctor"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.9", features = ["legacy"] }
serde_json = "1.0"

[dev-dependencies]
near-sdk = { version = "5.9", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.23.0-rust-1.99.1"
image_digest = "sha256:8013f039e8005627f10ae66b5519d1a6eeeed7d7aef4b5067d5e9a86c4302fcc"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]
