[package]
name = "proctor-grader"
version = "0.2.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "proctor-grader"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasi-http-client = "0.2"
wasi = "0.13"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
